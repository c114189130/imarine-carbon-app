<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歷史記錄 - {{ app_title }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .history-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 15px;
            overflow: hidden;
        }
        .history-table th {
            background: linear-gradient(135deg, #03045e, #0077b6);
            color: white;
            padding: 12px;
            text-align: center;
        }
        .history-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            color: #1a1a1a;
        }
        .history-table tr:hover {
            background: #f0f8ff;
        }
        h1 {
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .badge-sea {
            background: #0077b6;
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
        }
        .badge-road {
            background: #f39c12;
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
        }
        .stats-summary {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .stat-item {
            text-align: center;
            padding: 0.5rem 1rem;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00b4d8;
        }
        .stat-label {
            font-size: 0.8rem;
            color: #ccc;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">🌊 {{ app_title }}</div>
        <div class="navbar-links">
            <a href="/">🏠 首頁</a>
            <a href="/history_page">📊 歷史記錄</a>
            <a href="/dashboard">📈 Dashboard</a>
        </div>
    </nav>
    
    <div class="container">
        <h1>📊 貨櫃指派/訂艙歷史記錄</h1>
        
        <!-- 簡易統計摘要 -->
        <div class="stats-summary" id="statsSummary">
            <div class="stat-item">
                <div class="stat-value" id="totalRecords">0</div>
                <div class="stat-label">總記錄數</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalContainers">0</div>
                <div class="stat-label">總貨櫃數 (FEU)</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalCarbonReduction">0</div>
                <div class="stat-label">總減碳量 (kg)</div>
            </div>
        </div>
        
        <div class="card fade-in">
            <div style="overflow-x:auto">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>時間</th>
                            <th>起點</th>
                            <th>終點</th>
                            <th>貨櫃數(FEU)</th>
                            <th>貨物類型</th>
                            <th>距離(km)</th>
                            <th>碳排放(kg)</th>
                            <th>運輸模式</th>
                            <th>減碳量(kg)</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody">
                        <tr><td colspan="9">載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 1rem">
            <button class="btn btn-outline" onclick="location.reload()">🔄 刷新</button>
            <button class="btn btn-outline" onclick="location.href='/'">🏠 返回首頁</button>
            <button class="btn btn-outline" onclick="location.href='/dashboard'">📈 前往儀表板</button>
        </div>
    </div>
    
    <script>
        async function loadHistory() {
            try {
                const response = await fetch('/get_history');
                const data = await response.json();
                const tbody = document.getElementById('historyBody');
                tbody.innerHTML = '';
                
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9">暫無歷史記錄，請先進行貨櫃指派或訂艙</td></tr>';
                    return;
                }
                
                // 計算統計
                let totalContainers = 0;
                let totalCarbonReduction = 0;
                
                // 顯示最近50筆，最新的在上面
                const reversed = [...data].reverse();
                reversed.forEach(record => {
                    totalContainers += record.containers || 0;
                    totalCarbonReduction += record.carbon_improvement || 0;
                    
                    const modeBadge = record.best_mode === '海運' 
                        ? '<span class="badge-sea">🚢 海運</span>' 
                        : '<span class="badge-road">🚛 公路</span>';
                    
                    tbody.innerHTML += `
                        <tr>
                            <td>${record.date || '-'}</td>
                            <td>${record.start || '-'}</td>
                            <td>${record.end || '-'}</td>
                            <td>${(record.containers || 0).toLocaleString()}</td>
                            <td>${record.cargo_type || '一般'}</td>
                            <td>${record.base_distance || '-'}</td>
                            <td>${(record.sea_carbon || 0).toLocaleString()}</td>
                            <td>${modeBadge}</td>
                            <td style="color: #27ae60; font-weight: bold;">${(record.carbon_improvement || 0).toLocaleString()}</td>
                        </tr>
                    `;
                });
                
                // 更新統計摘要
                document.getElementById('totalRecords').innerText = data.length;
                document.getElementById('totalContainers').innerText = totalContainers.toLocaleString();
                document.getElementById('totalCarbonReduction').innerText = totalCarbonReduction.toLocaleString();
                
            } catch(e) {
                console.error("載入失敗:", e);
                document.getElementById('historyBody').innerHTML = '<tr><td colspan="9">載入失敗</td></tr>';
            }
        }
        
        loadHistory();
    </script>
</body>
</html>
