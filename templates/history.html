<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>歷史記錄 - {{ app_title }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body onload="loadHistory()">
<nav class="navbar">
    <div class="navbar-brand">🌊 {{ app_title }}</div>
    <div class="navbar-links"><a href="/">🏠</a><a href="/input">🚢</a></div>
</nav>
<div class="container">
    <h1>📊 歷史記錄</h1>
    <div class="card">
        <table class="cost-table" style="width:100%;">
            <thead><tr><th>時間</th><th>起點</th><th>終點</th><th>貨櫃</th><th>最佳方案</th><th>減碳量</th></tr></thead>
            <tbody id="historyBody"><tr><td colspan="6">載入中...</td></tr></tbody>
        </table>
    </div>
</div>
<script>
function loadHistory(){
    fetch("/get_history")
    .then(function(r){return r.json();})
    .then(function(data){
        var tb = document.getElementById("historyBody");
        tb.innerHTML = "";
        if(data.length===0){tb.innerHTML='<tr><td colspan="6">無記錄</td></tr>';return;}
        data.reverse().forEach(function(r){
            tb.innerHTML += '<tr><td>'+r.date+'</td><td>'+r.start+'</td><td>'+r.end+'</td><td>'+r.containers+'</td><td>'+r.decision+'</td><td>'+(r.ci||0)+' kg</td></tr>';
        });
    });
}
</script>
</body>
</html>
