<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歷史記錄 - {{ app_title }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .history-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 15px;
            overflow: hidden;
        }
        .history-table th {
            background: linear-gradient(135deg, #03045e, #0077b6);
            color: white;
            padding: 12px;
            text-align: center;
        }
        .history-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            color: #1a1a1a;
        }
        .history-table tr:hover {
            background: #f0f8ff;
        }
        h1 {
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .badge-sea {
            background: #0077b6;
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
        }
        .badge-road {
            background: #f39c12;
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">🌊 {{ app_title }}</div>
        <div class="navbar-links">
            <a href="/">🏠 首頁</a>
            <a href="/history_page">📊 歷史記錄</a>
            <a href="/dashboard">📈 Dashboard</a>
        </div>
    </nav>
    
    <div class="container">
        <h1>📊 貨櫃指派/訂艙歷史記錄</h1>
        
        <div class="chart-container fade-in">
            <canvas id="historyChart"></canvas>
        </div>
        
        <div class="card fade-in">
            <div style="overflow-x:auto">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>時間</th>
                            <th>起點</th>
                            <th>終點</th>
                            <th>貨櫃數(FEU)</th>
                            <th>貨物類型</th>
                            <th>距離(km)</th>
                            <th>碳排放(kg)</th>
                            <th>運輸模式</th>
                            <th>減碳量(kg)</th>
                            <th>節省金額(NTD)</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody">
                        <tr><td colspan="10">載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 1rem">
            <button class="btn btn-outline" onclick="location.reload()">🔄 刷新</button>
            <button class="btn btn-outline" onclick="location.href='/'">🏠 返回首頁</button>
        </div>
    </div>
    
    <script>
        async function loadHistory() {
            try {
                const response = await fetch('/get_history');
                const data = await response.json();
                const tbody = document.getElementById('historyBody');
                tbody.innerHTML = '';
                
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="10">暫無歷史記錄，請先進行貨櫃指派或訂艙</td></tr>';
                    return;
                }
                
                // 顯示最近50筆，最新的在上面
                const reversed = [...data].reverse();
                reversed.forEach(record => {
                    // 計算節省金額（如果沒有 savings_amount，就用 carbon_improvement 推算）
                    let savingsAmount = record.savings_amount || 0;
                    if (!savingsAmount && record.carbon_improvement) {
                        // 碳排節省量 * 碳價 (約 0.3元/kg) 作為參考節省金額
                        savingsAmount = Math.round(record.carbon_improvement * 0.3);
                    }
                    
                    const modeBadge = record.best_mode === '海運' 
                        ? '<span class="badge-sea">🚢 海運</span>' 
                        : '<span class="badge-road">🚛 公路</span>';
                    
                    tbody.innerHTML += `
                        <tr>
                            <td>${record.date || '-'}</td>
                            <td>${record.start || '-'}</td>
                            <td>${record.end || '-'}</td>
                            <td>${(record.containers || 0).toLocaleString()}</td>
                            <td>${record.cargo_type || '一般'}</td>
                            <td>${record.base_distance || '-'}</td>
                            <td>${(record.sea_carbon || 0).toLocaleString()}</td>
                            <td>${modeBadge}</td>
                            <td>${(record.carbon_improvement || 0).toLocaleString()}</td>
                            <td style="color: #27ae60; font-weight: bold;">NT$ ${savingsAmount.toLocaleString()}</td>
                        </tr>
                    `;
                });
                
                drawHistoryChart(data);
            } catch(e) {
                console.error("載入失敗:", e);
                document.getElementById('historyBody').innerHTML = '<tr><td colspan="10">載入失敗</td></tr>';
            }
        }
        
        function drawHistoryChart(history) {
            const ctx = document.getElementById('historyChart');
            if (!ctx) return;
            
            const last7 = history.slice(-7);
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: last7.map(h => h.date?.split(' ')[0] || ''),
                    datasets: [
                        {
                            label: '減碳量 (kg CO2e)',
                            data: last7.map(h => h.carbon_improvement || 0),
                            borderColor: '#0077b6',
                            backgroundColor: 'rgba(0, 119, 182, 0.1)',
                            fill: true,
                            tension: 0.4
                        },
                        {
                            label: '節省金額 (NTD)',
                            data: last7.map(h => {
                                let savings = h.savings_amount || 0;
                                if (!savings && h.carbon_improvement) savings = Math.round(h.carbon_improvement * 0.3);
                                return savings;
                            }),
                            borderColor: '#27ae60',
                            backgroundColor: 'rgba(39, 174, 96, 0.1)',
                            fill: true,
                            tension: 0.4,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        tooltip: { mode: 'index', intersect: false },
                        legend: { position: 'top', labels: { color: '#333' } }
                    },
                    scales: {
                        y: { title: { display: true, text: '減碳量 (kg)', color: '#0077b6' } },
                        y1: { position: 'right', title: { display: true, text: '節省金額 (NTD)', color: '#27ae60' }, grid: { drawOnChartArea: false } }
                    }
                }
            });
        }
        
        loadHistory();
    </script>
</body>
</html>
