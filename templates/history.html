<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歷史記錄 - {{ app_title }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .history-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 15px;
            overflow: hidden;
        }
        .history-table th {
            background: linear-gradient(135deg, #03045e, #0077b6);
            color: white;
            padding: 12px;
            text-align: center;
        }
        .history-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
            color: #333;
        }
        .history-table tr:hover td {
            background: #f0f8ff;
        }
        .badge-sea {
            background: #0077b6;
            color: white;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        .badge-road {
            background: #f39c12;
            color: white;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        h1 { color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .card { background: rgba(255,255,255,0.95); border-radius: 20px; padding: 1.5rem; margin-bottom: 2rem; }
        .btn-outline { background: transparent; border: 2px solid #00b4d8; color: #00b4d8; padding: 8px 20px; border-radius: 25px; cursor: pointer; margin: 0.5rem; }
        .btn-outline:hover { background: #00b4d8; color: white; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">🌊 {{ app_title }}</div>
        <div class="navbar-links">
            <a href="/">🏠 首頁</a>
            <a href="/history_page">📊 歷史記錄</a>
            <a href="/dashboard">📈 Dashboard</a>
        </div>
    </nav>
    
    <div class="container">
        <h1>📊 貨櫃指派/訂艙歷史記錄</h1>
        
        <div class="card">
            <div style="overflow-x:auto">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>時間</th>
                            <th>起點</th>
                            <th>終點</th>
                            <th>貨櫃數(FEU)</th>
                            <th>貨物類型</th>
                            <th>距離(km)</th>
                            <th>碳排(kg)</th>
                            <th>最佳方案</th>
                            <th>減碳量(kg)</th>
                            <th>減碳比例</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody">
                        <tr><td colspan="10">載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div style="display: flex; gap: 1rem; justify-content: center;">
            <button class="btn btn-outline" onclick="location.reload()">🔄 刷新</button>
            <button class="btn btn-outline" onclick="location.href='/'">🏠 返回首頁</button>
        </div>
    </div>
    
    <script>
        async function loadHistory() {
            try {
                const response = await fetch('/get_history');
                const data = await response.json();
                const tbody = document.getElementById('historyBody');
                tbody.innerHTML = '';
                
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="10">暫無歷史記錄</td></tr>';
                    return;
                }
                
                // 顯示最近50筆，最新的在上面
                const reversed = [...data].reverse();
                
                for (const r of reversed) {
                    // 根據方案顯示不同的碳排值
                    let carbonDisplay = '';
                    let reductionDisplay = '';
                    let reductionPctDisplay = '';
                    
                    if (r.best_mode === '海運') {
                        carbonDisplay = (r.sea_carbon || 0).toFixed(0);
                        reductionDisplay = (r.carbon_improvement || 0).toFixed(0);
                        reductionPctDisplay = (r.reduction_pct || 0).toFixed(1) + '%';
                    } else {
                        // 陸運：顯示公路碳排
                        carbonDisplay = (r.road_carbon || 0).toFixed(0);
                        reductionDisplay = '0';
                        reductionPctDisplay = '0%';
                    }
                    
                    const cargoTypeText = r.cargo_type === 'dangerous' ? '⚠️ 危險品' : 
                                         (r.cargo_type === 'reefer' ? '❄️ 冷鏈' : '📦 一般');
                    
                    tbody.innerHTML += `
                        <tr>
                            <td>${r.date || '-'}</td>
                            <td>${r.start || '-'}</td>
                            <td>${r.end || '-'}</td>
                            <td>${r.containers || 0}</td>
                            <td>${cargoTypeText}</td>
                            <td>${r.base_distance || '-'}</td>
                            <td>${carbonDisplay}</td>
                            <td><span class="${r.best_mode === '海運' ? 'badge-sea' : 'badge-road'}">${r.best_mode || '-'}</span></td>
                            <td>${reductionDisplay}</td>
                            <td>${reductionPctDisplay}</td>
                        </tr>
                    `;
                }
            } catch(e) {
                console.error("載入失敗:", e);
                document.getElementById('historyBody').innerHTML = '<tr><td colspan="10">載入失敗</td></tr>';
            }
        }
        
        loadHistory();
    </script>
</body>
</html>
