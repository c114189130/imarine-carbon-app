<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>碳排認證 - {{ app_title }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">🌊 {{ app_title }}</div>
        <div class="navbar-links">
            <a href="/">🏠 首頁</a>
            <a href="/input">🚢 開始指派</a>
            <a href="/history_page">📊 歷史記錄</a>
        </div>
    </nav>
    <div class="container">
        <div class="card" style="max-width:500px;margin:0 auto">
            <h2>📄 碳排認證證書</h2>
            <div class="form-group">
                <label>🏢 公司名稱</label>
                <input type="text" id="companyName" placeholder="請輸入公司全名">
            </div>
            <button class="btn btn-primary" onclick="generateCert()" style="width:100%">✅ 產生認證</button>
            <div id="certResult" style="margin-top:1rem"></div>
        </div>
    </div>
    <script>
        function generateCert() {
            const name = document.getElementById("companyName").value;
            if (!name) { alert("請輸入公司名稱"); return; }
            const recordId = localStorage.getItem("recordId");
            
            fetch("/certificate", {
                method: "POST",
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ company_name: name, record_id: recordId })
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) { alert(data.error); return; }
                localStorage.setItem("cert", JSON.stringify(data));
                document.getElementById("certResult").innerHTML = `
                    <div style="text-align:center">
                        <h3>✅ 碳排認證已產生</h3>
                        <p>🏢 公司：${data.company_name}</p>
                        <p>📋 編號：${data.cert_id}</p>
                        <p>📅 日期：${data.issued_at}</p>
                        <p>🌱 減碳量：${Number(data.carbon_improvement).toLocaleString()} kg CO2e</p>
                        <button class="btn btn-primary" onclick="downloadPDF('zh')">📄 下載中文證書</button>
                        <button class="btn btn-outline" onclick="downloadPDF('en')">📄 Download English</button>
                    </div>
                `;
            });
        }
        
        function downloadPDF(lang) {
            const cert = JSON.parse(localStorage.getItem("cert"));
            if (!cert) { alert("請先產生認證"); return; }
            window.open('/download_certificate/' + cert.cert_id + '/' + lang, '_blank');
        }
    </script>
</body>
</html>
