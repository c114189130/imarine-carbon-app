<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貨櫃指派 - {{ app_title }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">🌊 {{ app_title }}</div>
        <div class="navbar-links">
            <a href="/">🏠 首頁</a>
            <a href="/input">🚢 開始指派</a>
            <a href="/history_page">📊 歷史記錄</a>
            <a href="/dashboard">📈 儀表板</a>
        </div>
    </nav>

    <div class="container">
        <div class="hero">
            <h1>🚢 貨櫃運輸指派系統</h1>
            <p style="color:white;margin-top:1rem;">選擇起迄港口，智慧計算路拖 vs 海拖最佳方案</p>
        </div>

        <div class="card" style="max-width:600px;margin:0 auto;">
            <h2>📋 運輸需求</h2>
            
            <div class="form-group">
                <label for="startPort">🚀 起始港</label>
                <select id="startPort" onchange="updateEndPorts()">
                    <option value="">請選擇起始港</option>
                    <option value="kaohsiung">高雄港</option>
                    <option value="taichung">台中港</option>
                    <option value="taipei">汐止調度場</option>
                </select>
            </div>

            <div class="form-group">
                <label for="endPort">🏁 目的港</label>
                <select id="endPort">
                    <option value="">請先選擇起始港</option>
                </select>
            </div>

            <div class="form-group">
                <label for="shipDate">📅 預定出貨日期</label>
                <input type="date" id="shipDate">
            </div>

            <div class="form-group">
                <label for="containers">📦 貨櫃數量 (FEU)</label>
                <input type="number" id="containers" placeholder="請輸入 1-5000 FEU" min="1" max="5000" value="100">
            </div>

            <div style="text-align:center;margin-top:2rem;">
                <button class="btn btn-primary" onclick="goToResult()" style="width:100%;font-size:1.2rem;padding:15px;">🚀 開始計算</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section"><h4>📞 聯絡我們</h4><ul><li>📧 imarine@example.com</li></ul></div>
        </div>
        <div class="footer-bottom"><p>© 2024 iMarine</p></div>
    </footer>

    <script>
        var allPorts = [
            {value:"kaohsiung",label:"高雄港"},
            {value:"taichung",label:"台中港"},
            {value:"taipei",label:"汐止調度場"}
        ];
        function updateEndPorts(){
            var sv = document.getElementById("startPort").value;
            var es = document.getElementById("endPort");
            es.innerHTML = '<option value="">請選擇目的港</option>';
            if(!sv) return;
            allPorts.forEach(function(p){
                if(p.value !== sv){
                    var o = document.createElement("option");
                    o.value = p.value;
                    o.textContent = p.label;
                    es.appendChild(o);
                }
            });
        }
        function goToResult(){
            var start = document.getElementById("startPort").value;
            var end = document.getElementById("endPort").value;
            var containers = document.getElementById("containers").value;
            var shipDate = document.getElementById("shipDate").value;
            if(!start){alert("請選擇起始港");return;}
            if(!end){alert("請選擇目的港");return;}
            if(!containers || containers<=0 || containers>5000){alert("貨櫃數量需介於 1 到 5000 FEU");return;}
            localStorage.setItem("start", start);
            localStorage.setItem("end", end);
            localStorage.setItem("containers", containers);
            localStorage.setItem("shipDate", shipDate);
            window.location.href = "/result";
        }
        document.getElementById("shipDate").value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
