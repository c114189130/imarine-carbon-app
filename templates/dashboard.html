<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>儀表板 - {{ app_title }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 強制儀表板文字顏色 */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }
        .kpi-card {
            background: white !important;
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .kpi-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #0077b6 !important;
        }
        .kpi-label {
            font-size: 0.9rem;
            color: #023e8a !important;
            margin-top: 0.5rem;
        }
        h1 {
            color: white !important;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .chart-container {
            background: white;
            padding: 1.5rem;
            border-radius: 20px;
            margin: 1rem 0;
        }
    </style>
</head>
<body onload="loadDashboard()">
    <nav class="navbar">
        <div class="navbar-brand">🌊 {{ app_title }}</div>
        <div class="navbar-links">
            <a href="/">🏠 首頁</a>
            <a href="/history_page">📊 歷史記錄</a>
            <a href="/dashboard">📈 Dashboard</a>
        </div>
    </nav>
    <div class="container">
        <h1>📈 碳排放儀表板</h1>
        
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-value" id="totalReduction">-</div>
                <div class="kpi-label">總減碳量 (kg CO2e)</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-value" id="avgReduction">-</div>
                <div class="kpi-label">平均減碳比例</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-value" id="totalCount">-</div>
                <div class="kpi-label">總指派次數</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-value" id="seaRate">-</div>
                <div class="kpi-label">海運推薦率</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-value" id="totalRevenue">-</div>
                <div class="kpi-label">總營收 (NTD)</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-value" id="totalBookings">-</div>
                <div class="kpi-label">總訂艙次數</div>
            </div>
        </div>
        
        <div class="chart-container fade-in">
            <h3>📉 減碳趨勢</h3>
            <canvas id="trendChart"></canvas>
        </div>
        
        <div class="chart-container fade-in">
            <h3>🥧 運輸模式分佈</h3>
            <canvas id="modeChart"></canvas>
        </div>
        
        <div class="chart-container fade-in">
            <h3>📦 艙等預訂分佈</h3>
            <canvas id="cargoTypeChart"></canvas>
        </div>
        
        <button class="btn btn-outline" onclick="location.href='/'">🏠 返回首頁</button>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
