<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>儀表板 - {{ app_title }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body onload="loadDashboard()">
    <nav class="navbar">
        <div class="navbar-brand">🌊 {{ app_title }}</div>
        <div class="navbar-links">
            <a href="/">🏠 首頁</a>
            <a href="/input">🚢 開始指派</a>
            <a href="/history_page">📊 歷史記錄</a>
            <a href="/dashboard">📈 儀表板</a>
        </div>
    </nav>
    <div class="container">
        <h1>📈 碳排放儀表板</h1>
        <div class="stats-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:1.5rem; margin:2rem 0;">
            <div class="stat-card" style="background:white; padding:1.5rem; border-radius:20px; text-align:center;">
                <h3 id="totalReduction" style="font-size:2rem;">-</h3>
                <p>總減碳量 (kg)</p>
            </div>
            <div class="stat-card" style="background:white; padding:1.5rem; border-radius:20px; text-align:center;">
                <h3 id="avgReduction" style="font-size:2rem;">-</h3>
                <p>平均減碳比例</p>
            </div>
            <div class="stat-card" style="background:white; padding:1.5rem; border-radius:20px; text-align:center;">
                <h3 id="totalCount" style="font-size:2rem;">-</h3>
                <p>總指派次數</p>
            </div>
            <div class="stat-card" style="background:white; padding:1.5rem; border-radius:20px; text-align:center;">
                <h3 id="seaRate" style="font-size:2rem;">-</h3>
                <p>海運推薦率</p>
            </div>
        </div>
        <button class="btn btn-outline" onclick="location.href='/'">🏠 返回首頁</button>
    </div>
    <script>
        function loadDashboard() {
            fetch("/get_history")
                .then(res => res.json())
                .then(data => {
                    if (data.length === 0) {
                        document.getElementById("totalReduction").innerText = "0";
                        document.getElementById("avgReduction").innerText = "0%";
                        document.getElementById("totalCount").innerText = "0";
                        document.getElementById("seaRate").innerText = "0%";
                        return;
                    }
                    const total = data.reduce((s, d) => s + (d.carbon_improvement || 0), 0);
                    const avg = data.reduce((s, d) => s + (d.reduction_pct || 0), 0) / data.length;
                    const seaCount = data.filter(d => d.best_mode === "海運").length;
                    
                    document.getElementById("totalReduction").innerText = Number(total).toLocaleString();
                    document.getElementById("avgReduction").innerText = avg.toFixed(1) + "%";
                    document.getElementById("totalCount").innerText = data.length;
                    document.getElementById("seaRate").innerText = Math.round(seaCount / data.length * 100) + "%";
                });
        }
    </script>
</body>
</html>
