<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>儀表板 - {{ app_title }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body onload="loadDash()">
<nav class="navbar">
    <div class="navbar-brand">🌊 {{ app_title }}</div>
    <div class="navbar-links"><a href="/">🏠</a><a href="/input">🚢</a></div>
</nav>
<div class="container">
    <h1>📈 儀表板</h1>
    <div class="stats-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;">
        <div class="stat-card"><h3 id="totalCO2">0</h3><p>總減碳量 (kg)</p></div>
        <div class="stat-card"><h3 id="avgPct">0%</h3><p>平均減碳比例</p></div>
        <div class="stat-card"><h3 id="totalCount">0</h3><p>總次數</p></div>
        <div class="stat-card"><h3 id="seaRate">0%</h3><p>海運推薦率</p></div>
    </div>
</div>
<script>
function loadDash(){
    fetch("/get_history")
    .then(function(r){return r.json();})
    .then(function(data){
        if(data.length===0)return;
        var total=0,sea=0;
        data.forEach(function(d){total+=d.ci||0;if(d.decision&&d.decision.indexOf("sea")>=0)sea++;});
        document.getElementById("totalCO2").innerText=total.toLocaleString();
        document.getElementById("avgPct").innerText=(data.reduce(function(s,d){return s+(d.rp||0);},0)/data.length).toFixed(1)+"%";
        document.getElementById("totalCount").innerText=data.length;
        document.getElementById("seaRate").innerText=Math.round(sea/data.length*100)+"%";
    });
}
</script>
</body>
</html>
