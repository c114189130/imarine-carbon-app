<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>證書驗證 - {{ app_title }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="navbar">
    <div class="navbar-brand">🌊 {{ app_title }}</div>
    <div class="navbar-links"><a href="/">🏠</a></div>
</nav>
<div class="container">
    <div class="card" style="max-width:600px;margin:0 auto;text-align:center;">
        {% if valid %}
        <h2>✅ 證書驗證成功</h2>
        <p>證書編號：{{ cert.cert_id }}</p>
        <p>公司名稱：{{ cert.company_name }}</p>
        <p>減碳量：{{ cert.record.ci }} kg CO2e</p>
        {% else %}
        <h2>❌ 查無此證書</h2>
        {% endif %}
        <a href="/" class="btn btn-primary">返回首頁</a>
    </div>
</div>
</body>
</html>
